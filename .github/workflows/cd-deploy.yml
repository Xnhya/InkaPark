name: CD - Deploy Continuo
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
jobs:
  pages:
    name: Desplegar GitHub Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p static-site/css static-site/js static-site/images
          cp -r src/main/resources/static/css/* static-site/css/ 2>/dev/null || true
          cp -r src/main/resources/static/js/* static-site/js/ 2>/dev/null || true
          cp -r src/main/resources/static/images/* static-site/images/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static-site
      - id: deployment
        uses: actions/deploy-pages@v4
  release:
    name: Crear Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn package -DskipTests -q
      - uses: softprops/action-gh-release@v2
        with:
          name: InkaPark ${{ github.ref_name }}
          body: "## InkaPark ${{ github.ref_name }}\n### Cambios incluidos\n- Ver el changelog para detalles completos."
          files: target/*.jar
          generate_release_notes: true
