name: CI - Build & Test
on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inkapark
          MYSQL_USER: inkapark
          MYSQL_PASSWORD: 12345
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn compile -q
      - run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/inkapark?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: inkapark
          SPRING_DATASOURCE_PASSWORD: 12345
      - run: mvn package -DskipTests -q
      - uses: actions/upload-artifact@v4
        with:
          name: inkapark-jar
          path: target/*.jar
          retention-days: 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7
