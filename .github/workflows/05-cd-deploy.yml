name: CD 05 - Deploy Continuo

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  deploy-pages:
    name: Desplegar a GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Copiar assets estaticos
        run: |
          mkdir -p static-site/css static-site/js static-site/images
          cp -r src/main/resources/static/css/* static-site/css/ 2>/dev/null || true
          cp -r src/main/resources/static/js/* static-site/js/ 2>/dev/null || true
          cp -r src/main/resources/static/images/* static-site/images/ 2>/dev/null || true

      - name: Empaquetar artifact con nombre unico
        run: |
          tar -czf github-pages.tar.gz -C static-site .
          echo "artifact_name=pages-${{ github.run_id }}" >> $GITHUB_ENV

      - name: Cargar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: github-pages.tar.gz
          retention-days: 1

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.artifact_name }}

  release:
    name: Crear Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Empaquetar JAR
        run: mvn package -DskipTests -q

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          name: InkaPark ${{ github.ref_name }}
          body: |
            ## InkaPark ${{ github.ref_name }}
            ### Cambios incluidos
            - Ver el changelog para detalles completos.
            ### Archivos
            - JAR ejecutable adjunto.
          files: target/*.jar
          generate_release_notes: true