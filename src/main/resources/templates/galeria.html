<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galería - InkaPark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <nav class="navbar navbar-expand-lg" th:replace="~{index :: #navbar}"></nav>

    <section class="container mt-5 pt-5">
        <h1 class="text-center mb-4">Galería InkaPark</h1>
        <div class="row g-4">
            <div class="col-md-4" th:each="img : ${T(java.util.Arrays).asList('Atraccion1.jpg','Aldea inca.png','Circuito inca.png','Descenso del condor.png','Inti raymi.png','Casa del tejido.png')}">
                <div class="card shadow-sm">
                    <img th:src="@{'/images/' + ${img}}" class="card-img-top" alt="Galería" style="height:200px;object-fit:cover;" />
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">&copy; 2026 InkaPark</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
