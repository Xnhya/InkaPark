<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <title th:text="${esEdicion} ? 'Editar Usuario' : 'Nuevo Usuario'">Formulario Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/admin}">InkaPark Admin</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 th:text="${esEdicion} ? 'Editar Usuario' : 'Nuevo Usuario'"></h2>
        <form th:action="@{/admin/usuarios/guardar}" method="post" class="mt-3">
            <input type="hidden" name="idUsuario" th:value="${usuario.idUsuario}" />
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" name="nombre" class="form-control" th:value="${usuario.nombre}" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="email" name="correo" class="form-control" th:value="${usuario.correo}" required />
            </div>
            <div class="mb-3">
                <label class="form-label" th:text="${esEdicion} ? 'Nueva contraseña (dejar vacío para mantener)' : 'Contraseña'">Contraseña</label>
                <input type="password" name="contrasena" class="form-control" th:required="${!esEdicion}" />
            </div>
            <div class="mb-3">
                <label class="form-label">Rol</label>
                <select name="rol" class="form-select">
                    <option value="CLIENTE" th:selected="${usuario.rol == 'CLIENTE'}">Cliente</option>
                    <option value="ADMIN" th:selected="${usuario.rol == 'ADMIN'}">Administrador</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" th:text="${esEdicion} ? 'Actualizar' : 'Crear'">Guardar</button>
            <a th:href="@{/admin/usuarios}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
